# ============================================================================
# VYREX v4 - Conda Environment Definition
# ============================================================================
# A devastating 2v2 Rocket League AI trained with PPO via rlgym-learn
#
# HARDWARE TARGET: RTX 4070 Ti (12GB) + i7-14700K (20C/28T) + 48GB RAM
#
# Migration: v3 (rlgym-ppo) → v4 (rlgym-learn + rlgym-learn-algos)
# Added: TrueSkill rating tracking, faster SPS via Rust backend
#
# Setup Instructions:
#   1. conda env create -f environment.yml
#   2. conda activate vyrex
#   3. wandb login          (for training dashboards)
#   4. python train.py      (start training!)
#
# PyTorch CUDA Note:
#   The RTX 4070 Ti uses Ada Lovelace (AD104, compute capability 8.9).
#   CUDA 12.1 provides the best support for this architecture.
# ============================================================================

name: vyrex
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip>=23.0

  # === PyTorch with CUDA 12.1 — Optimal for RTX 4070 Ti (Ada Lovelace) ===
  - pytorch::pytorch>=2.2
  - pytorch::pytorch-cuda=12.1

  # === Scientific Computing ===
  - numpy>=1.24
  - scipy>=1.11

  # === Visualization & Monitoring ===
  - matplotlib>=3.7

  # === Utilities ===
  - pyyaml>=6.0
  - alive-progress>=3.1
  - psutil>=5.9

  # === pip-only dependencies ===
  - pip:
      # RLGym v2 ecosystem (RocketSim + RLViser)
      - "rlgym[rl-rlviser]>=2.0.0"

      # rlgym-learn: Fast parallelized training framework (replaces rlgym-ppo)
      - rlgym-learn

      # rlgym-learn-algos: PPO implementation for rlgym-learn
      - rlgym-learn-algos

      # rlgym-tools: Utility functions for RLGym
      - rlgym-tools

      # TrueSkill rating system
      - trueskill

      # Weights & Biases for training monitoring
      - wandb>=0.16

      # Compatibility layer for RLBot deployment
      - "rlgym-compat @ git+https://github.com/JPK314/rlgym-compat"

      # Additional utilities
      - rich>=13.0
      - tabulate>=0.9
