# ============================================================================
# VYREX — Match Configuration for 2v2 Testing
# ============================================================================
# Use this with the RLBot v5 GUI to test VYREX in a 2v2 match.
# Adjust car configs to add/remove bots as needed.

[rlbot]
launcher = "Steam"           # or "Epic"
auto_start_agents = true
wait_for_agents = true

[match]
game_mode = "Soccar"
game_map_upk = "DFHStadium_P"
skip_replays = true
start_without_countdown = false
existing_match_behavior = "Restart"
enable_rendering = true
enable_state_setting = true
freeplay = false

# --- Blue Team: 2x VYREX ---
[[match.cars]]
type = "RLBot"
team = 0
config_file = "./src/bot.toml"

[[match.cars]]
type = "RLBot"
team = 0
config_file = "./src/bot.toml"

# --- Orange Team: 2x Psyonix All-Star (hardest built-in bots) ---
[[match.cars]]
type = "Psyonix"
team = 1
skill = 1.0

[[match.cars]]
type = "Psyonix"
team = 1
skill = 1.0
